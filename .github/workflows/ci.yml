name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: assistant
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://assistant:ci@localhost:5432/assistant
      SECRET_KEY: ci-secret
      ADMIN_PASSWORD: ci-admin
      GATEWAY_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app
      - run: ruff format --check app
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --legacy-peer-deps
        working-directory: gateway
      - run: node --test
        working-directory: gateway

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app-image app
      - run: docker build -t gateway-image gateway
      # A build proves the Dockerfile parses; only a run proves the image starts.
      - run: docker run --rm gateway-image node --input-type=module -e "await import('./lib.js'); await import('./queue.js')"
      - run: docker run --rm app-image python -c "import chunking, retrieval, main"
