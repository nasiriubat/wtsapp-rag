services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb runs these once, on an empty volume only.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  app:
    build: ./app
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: unless-stopped

  gateway:
    build: ./gateway
    env_file: .env
    depends_on:
      - app
    volumes:
      - ./gateway/auth_state:/app/auth_state
    # The QR is printed to stdout; read it with `docker compose logs -f gateway`.
    tty: true
    restart: unless-stopped

volumes:
  pgdata:
