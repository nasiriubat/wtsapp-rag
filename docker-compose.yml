services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./app
    env_file: .env
    environment:
      DATABASE_URL: postgresql://assistant:${POSTGRES_PASSWORD}@db:5432/assistant
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Embedding and reranker models, downloaded once.
      - models:/models
      # Eval sets, read by scripts/eval.py.
      - ./evals:/app/evals:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start downloads ~2.5 GB of models.
      start_period: 600s
    restart: unless-stopped

  gateway:
    build: ./gateway
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./gateway/auth_state:/app/auth_state
      - ./gateway/data:/app/data
    ports:
      # Only the WhatsApp Cloud API channel listens here, for Meta's webhook.
      # Put TLS in front of it; Meta will not call plain HTTP.
      - "8080:8080"
    # The QR is printed to stdout; read it with `docker compose logs -f gateway`.
    tty: true
    restart: unless-stopped

volumes:
  pgdata:
  models:
