<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Group assistant</title>
  <link rel="stylesheet" href="/static/pico.min.css">
</head>
<body>
<main class="container" style="max-width: 24rem; margin-top: 4rem">
  <h1>Group assistant</h1>
  <form method="post" action="/admin/login">
    <label>Admin password
      <input type="password" name="password" autofocus required autocomplete="current-password">
    </label>
    {% if error %}<p class="bad" style="color: var(--pico-del-color)">{{ error }}</p>{% endif %}
    <button type="submit">Log in</button>
  </form>
  <p style="color: var(--pico-muted-color)">The password is <code>ADMIN_PASSWORD</code> in <code>.env</code>.</p>
</main>
</body>
</html>
