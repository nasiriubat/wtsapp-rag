<div class="card">
  <header><h3>Ask it from here</h3><span class="muted" style="font-size:12.5px">one real model call, logged like any question</span></header>
  <form hx-post="/admin/questions/ask" hx-target="#ask-result" hx-swap="innerHTML" hx-disabled-elt="find button">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="grid">
      <label>Group
        <select name="group_id" required>
          {% for g in groups if g.enabled %}<option value="{{ g.id }}">{{ g.name or g.external_id }}</option>{% endfor %}
        </select>
      </label>
      <label style="grid-column: span 2">Question
        <input name="question" placeholder="what did we decide about the cabin?" required></label>
    </div>
    <button>Ask</button>
  </form>
</div>
<div id="ask-result"></div>
