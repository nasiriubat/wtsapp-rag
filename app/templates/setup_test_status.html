{% if row %}
<div class="notice ok">The round trip works.</div>
<div class="card" style="margin-top:12px">
  <p><strong>{{ row.name or 'The group' }} asked</strong><br>{{ row.question }}</p>
  <p><strong>It answered</strong><br>{{ row.answer }}</p>
</div>
<div class="actions" style="margin-top:12px">
  <a href="/admin" class="btn">Open the dashboard</a>
  <a href="/admin/data" class="btn secondary">Import older history</a>
</div>
{% else %}
<p class="muted">Waiting for the first question…</p>
{% endif %}
